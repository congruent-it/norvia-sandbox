# The pull request gates of coding guidelines §11 (and the vulnerable-package check of §8), run on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  build:
    name: Build, format, unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The TMS UI's stylesheet is built with Tailwind CSS during the .NET build (ADR 0018).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Tms/Norvia.Tms.Web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Norvia.slnx

      # Warnings are errors (Directory.Build.props), so a clean build is also the "no warnings" gate.
      - name: Build
        run: dotnet build Norvia.slnx --no-restore --configuration "$CONFIGURATION"

      - name: Check formatting
        run: dotnet format Norvia.slnx --no-restore --verify-no-changes

      - name: Check for vulnerable packages
        run: |
          dotnet package list --project Norvia.slnx --vulnerable --include-transitive --format json > vulnerable-packages.json
          vulnerable=$(jq -r '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]
            | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"] | unique | .[]' vulnerable-packages.json)
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable packages found"
            echo "$vulnerable"
            exit 1
          fi

      # Each unit test project enforces the 80% line coverage threshold itself (Directory.Build.props).
      - name: Unit and architecture tests
        run: |
          failed=0
          for project in $(find tests -name '*.UnitTests.csproj' -o -name '*.ArchitectureTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      - name: Coverage summary
        if: always()
        run: |
          if find tests -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

  integration:
    name: Integration and UI tests (Aspire, SQL Server, Service Bus emulator, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The TMS UI's stylesheet is built with Tailwind CSS during the .NET build (ADR 0018).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Tms/Norvia.Tms.Web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Norvia.slnx --configuration "$CONFIGURATION"

      # Chromium's system libraries need root, so they are installed here rather than by the UI test fixture.
      - name: Install Playwright's Chromium
        run: pwsh tests/Tms/Norvia.Tms.Web.UiTests/bin/"$CONFIGURATION"/net10.0/playwright.ps1 install --with-deps chromium

      # The test host starts the AppHost, which runs SQL Server and the Service Bus emulator in Docker. UI tests keep
      # a Playwright trace and video of every failed test.
      - name: Integration and UI tests
        env:
          NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/tms-api.log
          NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
        run: |
          mkdir -p TestResults
          failed=0
          for project in $(find tests -name '*.IntegrationTests.csproj' -o -name '*.UiTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/
          if-no-files-found: ignore
