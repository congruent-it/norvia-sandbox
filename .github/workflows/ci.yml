# The pull request gates of coding guidelines §11 (and the vulnerable-package check of §8), run on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  # Scripts are PowerShell 7 (ADR 0048): every .ps1 parses, PSScriptAnalyzer reports no error and the shared module's Pester tests pass.
  powershell:
    name: PowerShell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse, analyze and test the scripts
        shell: pwsh
        run: ./infra/test-scripts.ps1

  # Dead relative links and deleted pages in the Markdown, nothing else (lychee.toml).
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: lycheeverse/lychee-action@v2.4.1
        with:
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true

  build:
    name: Build, format, Bicep and vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Norvia.slnx

      # Warnings are errors (Directory.Build.props), so a clean build is also the "no warnings" gate.
      - name: Build
        run: dotnet build Norvia.slnx --no-restore --configuration "$CONFIGURATION"

      - name: Check formatting
        run: dotnet format Norvia.slnx --no-restore --verify-no-changes

      # The estate is deployed by azd, not CI (ADR 0004); CI checks that it builds and passes the Bicep linter.
      - name: Build and lint the estate Bicep
        run: |
          az bicep install
          az bicep build --file infra/estate.bicep --stdout > /dev/null
          az bicep lint --file infra/estate.bicep

      - name: Check for vulnerable packages
        run: |
          dotnet package list --project Norvia.slnx --vulnerable --include-transitive --format json > vulnerable-packages.json
          vulnerable=$(jq -r '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]
            | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"] | unique | .[]' vulnerable-packages.json)
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable packages found"
            echo "$vulnerable"
            exit 1
          fi

      # Every application's tests run in its leg of the integration job. A test project outside every leg would run
      # nowhere, so a new application's tests either join a leg (or tests/Integration) or fail here.
      - name: Check that every test project is claimed by a leg
        run: |
          claimed=$(yq '.jobs.integration.strategy.matrix.include[].directory' .github/workflows/ci.yml; echo Integration; echo Branding; echo Docs; echo ServiceDefaults)
          unclaimed=$(find tests -name '*.csproj' | cut -d/ -f2 | sort -u | grep -vxF "$claimed" || true)
          if [ -n "$unclaimed" ]; then
            echo "::error::Test projects under tests/ that no integration leg runs: $unclaimed"
            exit 1
          fi

      # The Integration functions have unit tests only, so they run here. Each project enforces the 80% line coverage
      # threshold itself (Directory.Build.props).
      - name: Unit tests of the Integration functions and the shared Branding library, ServiceDefaults' faults and the docs generator
        run: |
          failed=0
          for project in $(find tests/Integration tests/Branding tests/Docs tests/ServiceDefaults -name '*.UnitTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      - name: Coverage summary
        if: always()
        run: |
          if find tests/Integration tests/Branding tests/Docs tests/ServiceDefaults -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/Integration/**/coverage.cobertura.xml;tests/Branding/**/coverage.cobertura.xml;tests/Docs/**/coverage.cobertura.xml;tests/ServiceDefaults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

  # One leg per application, each on a runner of its own with its own Docker daemon, so the AppHosts of the legs
  # can't clash. The TMS has fifteen legs: its unit and architecture tests, one leg for each of its integration test projects
  # (one per large component, one for its faults, and one for the small components together, coding guidelines §10) and five UI test projects. There are no path filters: every gate runs on every PR. The AppHost references every application, so
  # each leg builds the whole solution.
  integration:
    name: Tests (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: TMS
            directory: Tms
            kinds: UnitTests ArchitectureTests
          - application: TMS (Billing)
            directory: Tms
            kinds: IntegrationTests.Billing
          - application: TMS (Capacity)
            directory: Tms
            kinds: IntegrationTests.Capacity
          - application: TMS (Carrier bookings)
            directory: Tms
            kinds: IntegrationTests.CarrierBookings
          - application: TMS (Customer service agent)
            directory: Tms
            kinds: IntegrationTests.CustomerServiceAgent
          - application: TMS (Faults)
            directory: Tms
            kinds: IntegrationTests.Faults
          - application: TMS (Planning)
            directory: Tms
            kinds: IntegrationTests.Planning
          - application: TMS (Planner agent)
            directory: Tms
            kinds: IntegrationTests.PlannerAgent
          - application: TMS (Trips)
            directory: Tms
            kinds: IntegrationTests.Trips
          - application: TMS (other components)
            directory: Tms
            kinds: IntegrationTests.Remaining
          - application: TMS (UI, Customer service agent)
            directory: Tms
            kinds: UiTests.CustomerServiceAgent
          - application: TMS (UI, Planner agent)
            directory: Tms
            kinds: UiTests.PlannerAgent
          - application: TMS (UI, Planner agent, Plan the list)
            directory: Tms
            kinds: UiTests.PlannerAgentPlan
          - application: TMS (UI, Faults)
            directory: Tms
            kinds: UiTests.Faults
          - application: TMS (UI, Shipments)
            directory: Tms
            kinds: UiTests.Shipments
          - application: TMS (UI, Transport Orders)
            directory: Tms
            kinds: UiTests.TransportOrders
          - application: TMS (UI, other components)
            directory: Tms
            kinds: UiTests.Remaining
          - application: Partner portal
            directory: PartnerPortal
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Partner portal (Carrier and Shipper faults)
            directory: PartnerPortal
            kinds: IntegrationTests.Faults
          - application: Partner portal (Shipper tracking assistant)
            directory: PartnerPortal
            kinds: IntegrationTests.TrackingAssistant
          - application: Partner portal (UI, Intake agent)
            directory: PartnerPortal
            kinds: UiTests.IntakeAgent
          - application: Partner portal (UI, Shipper tracking assistant)
            directory: PartnerPortal
            kinds: UiTests.TrackingAssistant
          - application: ERP
            directory: Erp
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: ERP (Carrier invoice matching agent)
            directory: Erp
            kinds: IntegrationTests.FinanceAgent
          - application: ERP (UI, Carrier invoice matching agent)
            directory: Erp
            kinds: UiTests.FinanceAgent
          - application: Driver app
            directory: DriverApp
            kinds: UnitTests ArchitectureTests IntegrationTests
          - application: Simulator
            directory: Simulator
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Integration console
            directory: IntegrationConsole
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Integration
            directory: Integration
            kinds: IntegrationTests
          - application: Estate health check
            directory: HealthCheck
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build
        run: |
          dotnet tool restore
          dotnet build Norvia.slnx --configuration "$CONFIGURATION"

      # Chromium's system libraries need root, so they are installed here rather than by the UI test fixtures. Every UI
      # test project uses the same Playwright version, so the leg's own project's script serves.
      - name: Install Playwright's Chromium
        if: contains(matrix.kinds, 'UiTests')
        run: pwsh "$(find tests/${{ matrix.directory }} -path "*/bin/$CONFIGURATION/net10.0/playwright.ps1" -print -quit)" install --with-deps chromium

      # The integration and UI tests start the AppHost, which runs SQL Server and the Service Bus emulator in Docker. UI
      # tests keep a Playwright trace and video of every failed test. Each project enforces the 80% line coverage
      # threshold itself (Directory.Build.props).
      - name: Unit, architecture, integration and UI tests
        env:
          NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/tms-api.log
          NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
          # DCP, which Aspire starts the resources with, writes its own log: for an AppHost that stalls as it starts.
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
          DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/TestResults/dcp
        run: |
          mkdir -p TestResults
          failed=0
          for kind in ${{ matrix.kinds }}; do
            for project in $(find tests/${{ matrix.directory }} -name "*.$kind.csproj" | sort); do
              dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
                --logger trx --results-directory TestResults || failed=1
            done
          done
          exit $failed

      - name: Coverage summary
        if: always()
        run: |
          if find tests/${{ matrix.directory }} -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/${{ matrix.directory }}/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ matrix.directory }}-${{ strategy.job-index }}
          path: TestResults/
          if-no-files-found: ignore
