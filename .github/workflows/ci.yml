# The pull request gates of coding guidelines §11 (and the vulnerable-package check of §8), run on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  build:
    name: Build, format, Bicep and vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Norvia.slnx

      # Warnings are errors (Directory.Build.props), so a clean build is also the "no warnings" gate.
      - name: Build
        run: dotnet build Norvia.slnx --no-restore --configuration "$CONFIGURATION"

      - name: Check formatting
        run: dotnet format Norvia.slnx --no-restore --verify-no-changes

      # The estate is deployed by azd, not CI (ADR 0004); CI checks that it builds and passes the Bicep linter.
      - name: Build and lint the estate Bicep
        run: |
          az bicep install
          az bicep build --file infra/estate.bicep --stdout > /dev/null
          az bicep lint --file infra/estate.bicep

      - name: Check for vulnerable packages
        run: |
          dotnet package list --project Norvia.slnx --vulnerable --include-transitive --format json > vulnerable-packages.json
          vulnerable=$(jq -r '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]
            | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"] | unique | .[]' vulnerable-packages.json)
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable packages found"
            echo "$vulnerable"
            exit 1
          fi

      # Every application's tests run in its leg of the integration job. A test project outside every leg would run
      # nowhere, so a new application's tests either join a leg (or tests/Integration) or fail here.
      - name: Check that every test project is claimed by a leg
        run: |
          claimed=$(yq '.jobs.integration.strategy.matrix.include[].directory' .github/workflows/ci.yml; echo Integration)
          unclaimed=$(find tests -name '*.csproj' | cut -d/ -f2 | sort -u | grep -vxF "$claimed" || true)
          if [ -n "$unclaimed" ]; then
            echo "::error::Test projects under tests/ that no integration leg runs: $unclaimed"
            exit 1
          fi

      # The Integration functions have unit tests only, so they run here. Each project enforces the 80% line coverage
      # threshold itself (Directory.Build.props).
      - name: Unit tests of the Integration functions
        run: |
          failed=0
          for project in $(find tests/Integration -name '*.UnitTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      - name: Coverage summary
        if: always()
        run: |
          if find tests/Integration -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/Integration/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

  # One leg per application, each on a runner of its own with its own Docker daemon, so the AppHosts of the legs
  # can't clash. The TMS has six legs, as its integration tests start seven AppHosts: the tests that share the first
  # one, the tests whose fixtures start an AppHost of their own, at most two per leg (trait AppHost=Own1, Own2, Own3, Own4), and the UI tests. There are no path filters: every gate runs on every PR. The AppHost references every application, so
  # each leg builds the whole solution.
  integration:
    name: Tests (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: TMS
            directory: Tms
            kinds: UnitTests ArchitectureTests IntegrationTests
            filter: AppHost!=Own1&AppHost!=Own2&AppHost!=Own3&AppHost!=Own4
          - application: TMS (own AppHosts 1)
            directory: Tms
            kinds: IntegrationTests
            filter: AppHost=Own1
          - application: TMS (own AppHosts 2)
            directory: Tms
            kinds: IntegrationTests
            filter: AppHost=Own2
          - application: TMS (own AppHosts 3)
            directory: Tms
            kinds: IntegrationTests
            filter: AppHost=Own3
          - application: TMS (own AppHosts 4)
            directory: Tms
            kinds: IntegrationTests
            filter: AppHost=Own4
          - application: TMS (UI)
            directory: Tms
            kinds: UiTests
          - application: Partner portal
            directory: PartnerPortal
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Driver app
            directory: DriverApp
            kinds: UnitTests ArchitectureTests IntegrationTests
          - application: Integration console
            directory: IntegrationConsole
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build
        run: |
          dotnet tool restore
          dotnet build Norvia.slnx --configuration "$CONFIGURATION"

      # Chromium's system libraries need root, so they are installed here rather than by the UI test fixtures. Every UI
      # test project uses the same Playwright version, so the leg's own project's script serves.
      - name: Install Playwright's Chromium
        if: contains(matrix.kinds, 'UiTests')
        run: pwsh tests/${{ matrix.directory }}/*.UiTests/bin/"$CONFIGURATION"/net10.0/playwright.ps1 install --with-deps chromium

      # The integration and UI tests start the AppHost, which runs SQL Server and the Service Bus emulator in Docker. UI
      # tests keep a Playwright trace and video of every failed test. Each project enforces the 80% line coverage
      # threshold itself (Directory.Build.props).
      - name: Unit, architecture, integration and UI tests
        env:
          NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/tms-api.log
          NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
          FILTER: ${{ matrix.filter }}
          # DCP, which Aspire starts the resources with, writes its own log: for an AppHost that stalls as it starts.
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
          DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/TestResults/dcp
        run: |
          mkdir -p TestResults
          failed=0
          for kind in ${{ matrix.kinds }}; do
            for project in $(find tests/${{ matrix.directory }} -name "*.$kind.csproj" | sort); do
              dotnet test "$project" --no-build --configuration "$CONFIGURATION" ${FILTER:+--filter "$FILTER"} \
                --logger trx --results-directory TestResults || failed=1
            done
          done
          exit $failed

      - name: Coverage summary
        if: always()
        run: |
          if find tests/${{ matrix.directory }} -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/${{ matrix.directory }}/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ matrix.directory }}-${{ strategy.job-index }}
          path: TestResults/
          if-no-files-found: ignore
