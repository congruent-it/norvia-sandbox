apiVersion: v1
kind: Service
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "norvia.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: azurite
  ports:
    - name: blob
      port: 10000
      targetPort: 10000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
    {{- include "norvia.labels" . | nindent 4 }}
spec:
  serviceName: azurite
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
    spec:
      containers:
        - name: azurite
          image: {{ .Values.azurite.image }}
          # Only blobs: the claim-check and Proof of delivery containers are all the sandbox keeps here.
          args:
            - azurite-blob
            - --blobHost
            - "0.0.0.0"
            - --location
            - /data
            - --skipApiVersionCheck
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            periodSeconds: 5
          resources:
            {{- toYaml .Values.azurite.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.azurite.storage }}
