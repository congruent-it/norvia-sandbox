# Values for the Norvia chart. Cluster-scoped pieces (storage class, ingress, issuer) are values, never installs (ADR 0053).

image:
  # The registry (and path) the Norvia images are pulled from, e.g. registry.example.com/norvia. Empty means the image
  # names are used as they are, which suits a cluster that has them loaded locally.
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

persistence:
  # The storage class of every PVC. Empty means the cluster's default class.
  storageClass: ""

sql:
  image: mcr.microsoft.com/mssql/server:2022-latest
  # The SA password. Empty: the chart generates one at install and keeps it on upgrade (a lookup of the Secret; helm template
  # and --dry-run cannot look, so they render a random one). It goes into connection strings, so it must not contain a semicolon.
  saPassword: ""
  # SQL Server takes the memory the node has unless told otherwise. The AppHost holds its container to 1 GB too.
  memoryLimitMb: 1024
  storage: 10Gi
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { memory: 2Gi }

azurite:
  image: mcr.microsoft.com/azure-storage/azurite:3.34.0
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# One Job per migrations project, keyed by the name of the database it owns. Each Job creates its database first.
migrations:
  tms: { database: tms, image: tms-migrations }
  erp: { database: erp, image: erp-migrations }
  driver-app: { database: driver-app, image: driver-app-migrations }
  partner-portal: { database: partner-portal, image: partner-portal-migrations }
  simulator: { database: simulator, image: simulator-migrations }

# The image of the initContainers that wait for the migrations Jobs. Any image with kubectl in it.
kubectl:
  # Must have kubectl and need no shell (the waiter runs kubectl directly). Match it to the cluster's version.
  image: registry.k8s.io/kubectl:v1.37.2

# The Service Bus emulators (ADR 0053). Two, as under Aspire: each accepts only 10 concurrent connections and every app holds one, so
# messaging-2 holds the topics and queues of the Driver app, the ERP and the Carrier tracking path. The apps ask for either as
# "messaging" (include "norvia.serviceBusConnectionString"); in Azure both are the one namespace. Their state is in the data tier's
# SQL Server. The topics, subscriptions, filters and queues are those of infra/estate/messaging.bicep; the template tests compare them.
serviceBus:
  image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # The condition of each subscription that takes only some of its topic's messages. Every subscription also admits a resubmit aimed
  # at it (coding guidelines §7), which the template adds, bracketing a condition that has an OR. The same list is ResubmitAwareFilters.Conditions in the AppHost.
  conditions:
    carrier-booking: "assignedTo = 'Carrier'"
    shipper-notification: "eventType = 'ShipperNotificationRequested'"
    carrier-cancellation: "eventType = 'CarrierBookingCancelled' OR eventType = 'CarrierBookingWithdrawn'"
    carrier-invoice-outcome: "eventType = 'CarrierInvoiceApproved'"
    shipper-invoice: "eventType IN ('ShipperInvoiceIssued', 'CreditNoteIssued')"
    carrier-cost: "eventType = 'CarrierCostIncurred'"
    billing: "eventType = 'TransportOrderBillable'"
    master-data-sync: "eventType IN ('ShipperChanged', 'CarrierChanged', 'RateCardChanged', 'CarrierRateCardChanged', 'VehicleChanged', 'DriverChanged')"
    trip-dispatch: "eventType = 'TripDispatched'"
    driver-reports: "eventType = 'TripStartReported' OR eventType = 'TripEndReported' OR eventType = 'StopCompletedReported' OR eventType = 'ProofOfDeliveryCaptured'"
  emulators:
    messaging:
      topics:
        transport-order-events: [monitoring, billing]
        shipment-events: [monitoring, carrier-booking, shipper-notification, carrier-cancellation, carrier-cost]
        trip-events: [monitoring, trip-dispatch]
      queues: []
    messaging-2:
      topics:
        driver-app-events: [driver-reports]
        invoicing-events: [monitoring, shipper-invoice, carrier-invoice-outcome]
        master-data-events: [monitoring, master-data-sync]
      queues: [carrier-tracking, carrier-proof-of-delivery]
  # The subscriptions that use sessions (ADR 0016): one Trip's reports are read one at a time and in order.
  sessionSubscriptions: [driver-reports]
  # Lock durations of infra/estate/messaging.bicep, by subscription or queue name (ISO 8601). Long enough for a Logic App's retries of one
  # message, which hold the lock. The AppHost's emulator sets none; the chart matches the Bicep.
  lockDurations:
    billing: PT5M
    carrier-cost: PT5M
    driver-reports: PT5M
    carrier-tracking: PT1M
    carrier-proof-of-delivery: PT5M
