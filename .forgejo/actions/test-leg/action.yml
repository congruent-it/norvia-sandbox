# The steps of one leg of an application's test matrix (#1042, #1079): the application workflows differ in their legs, not in how a leg runs.
# The job calling it checks out, reports pending first and the result last (report-status), because the action is read from the checkout.
name: test-leg
description: Starts Docker, builds, and runs the test projects of one leg.
inputs:
  directory:
    description: The folder of tests/ that holds the leg's test projects (Tms, Erp, ...)
    required: true
  kinds:
    description: Space-separated kinds of test project the leg runs (UnitTests, IntegrationTests.Billing, UiTests, ...)
    required: true
  artifact:
    description: Name of the uploaded artifact of the leg's results, unique within the run
    required: true
runs:
  using: composite
  steps:
    # The AppHost runs SQL Server and the Service Bus emulator in Docker. The job container is privileged and has no host socket, so this starts the
    # daemon the leg alone uses (docs/operations/forgejo.md, "Runner for CI").
    - name: Start Docker
      shell: bash
      run: start-dockerd

    - uses: ./.forgejo/actions/setup

    - name: Build
      shell: bash
      run: |
        dotnet tool restore
        dotnet build Norvia.slnx --configuration "$CONFIGURATION"

    # Chromium's system libraries need root. The job runs as root, the job image's default user (the Dockerfile sets no USER), so `--with-deps`
    # works here as it does on GitHub's runner. Every UI test project uses the same Playwright version, so the leg's own project's script serves.
    - name: Install Playwright's Chromium
      if: contains(inputs.kinds, 'UiTests')
      shell: bash
      run: pwsh "$(find tests/${{ inputs.directory }} -path "*/bin/$CONFIGURATION/net10.0/playwright.ps1" -print -quit)" install --with-deps chromium

    # UI tests keep a Playwright trace and video of every failed test. Each project enforces the 80% line coverage threshold itself (Directory.Build.props).
    - name: Unit, architecture, integration and UI tests
      shell: bash
      env:
        NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/tms-api.log
        NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
        # DCP, which Aspire starts the resources with, writes its own log: for an AppHost that stalls as it starts.
        DCP_DIAGNOSTICS_LOG_LEVEL: debug
        DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/TestResults/dcp
      run: |
        mkdir -p TestResults
        failed=0
        for kind in ${{ inputs.kinds }}; do
          for project in $(find tests/${{ inputs.directory }} -name "*.$kind.csproj" | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
        done
        exit $failed

    # Forgejo has no $GITHUB_STEP_SUMMARY page, so the Markdown summary goes to the log (and stays in TestResults/coverage with the artifact).
    - name: Coverage summary
      if: always()
      shell: bash
      run: |
        if find tests/${{ inputs.directory }} -name coverage.cobertura.xml | grep -q .; then
          dotnet reportgenerator -reports:"tests/${{ inputs.directory }}/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
            -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat TestResults/coverage/SummaryGithub.md
        fi

    # v3: v4 needs GitHub's artifact service, which Forgejo does not have.
    - uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ${{ inputs.artifact }}
        path: TestResults/
        if-no-files-found: ignore
