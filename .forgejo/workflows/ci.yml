# The gates of CI (#1030). Forgejo pull-mirrors GitHub and a sync triggers `push` (ADR 0055); each job reports to the GitHub commit as the status forgejo/<job>.
# Needs the Forgejo secret GH_STATUS_TOKEN (docs/operations/forgejo.md, "The GitHub status token"). Each later gate adds a job like `skeleton`.
name: ci
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NUGET_PACKAGES is not set here: the runner image sets it to a volume the runner mounts, so restored packages survive between runs (.forgejo/runner/config.yaml).
env:
  CONFIGURATION: Release

jobs:
  skeleton:
    runs-on: norvia-ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}
      - name: Trivial check
        run: git log -1 --format=%H
      # Last, whatever happened: success, failure, or cancelled (a newer push superseded this run).
      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # Scripts are PowerShell 7 (ADR 0048): every .ps1 parses, PSScriptAnalyzer reports no error and the Pester tests pass. The same steps as the
  # `powershell` job of .github/workflows/ci.yml, which stays until the removal issue (#1030), so the two can be compared.
  powershell:
    runs-on: norvia-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The runner image has PowerShell and the modules (.forgejo/runner-image/Dockerfile), installed from infra/tool-versions.psd1. A stale image
      # fails here, with the version it has, and not as a confusing failure of the gate; rebuild it with runner-image.yml. The image's PATH is its own,
      # so nothing is written to $GITHUB_PATH.
      - name: Check the tool versions of the image
        shell: pwsh
        run: |
          $versions = Import-PowerShellDataFile ./infra/tool-versions.psd1
          $found = [ordered]@{ PowerShell = $PSVersionTable.PSVersion.ToString() }
          foreach ($name in 'PSScriptAnalyzer', 'Pester') {
              $module = Get-Module -ListAvailable $name | Sort-Object Version -Descending | Select-Object -First 1
              $found[$name] = $module ? $module.Version.ToString() : 'missing'
          }
          $found.Keys | ForEach-Object { Write-Host "$_ $($found[$_]) (pinned $($versions[$_]))" }
          $stale = $found.Keys | Where-Object { $found[$_] -ne $versions[$_] }
          if ($stale) { throw "The runner image is stale for $($stale -join ', '): rebuild it (docs/operations/forgejo.md, Runner for CI)." }

      - name: Parse, analyze and test the scripts
        shell: pwsh
        run: ./infra/test-scripts.ps1

      # While both CI systems run the tests, a leg in one matrix and not the other fails here (infra/compare-ci-matrices.ps1).
      - name: Compare the test matrix with GitHub's
        shell: pwsh
        run: ./infra/compare-ci-matrices.ps1

      # Every process doc under docs/processes is in its catalogue's table and in docs/status.md.
      - name: Check that every process doc is catalogued
        shell: pwsh
        run: ./infra/check-process-docs.ps1

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # Restore, a warnings-as-errors build, formatting, the estate's Bicep, vulnerable packages, and the unit tests of the projects no test leg runs. The same
  # steps as the `build` job of .github/workflows/ci.yml, which stays until the removal issue (#1030), so the two can be compared.
  build:
    runs-on: norvia-ci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: build
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      - uses: ./.forgejo/actions/setup

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Norvia.slnx

      # Warnings are errors (Directory.Build.props), so a clean build is also the "no warnings" gate.
      - name: Build
        run: dotnet build Norvia.slnx --no-restore --configuration "$CONFIGURATION"

      - name: Check formatting
        run: dotnet format Norvia.slnx --no-restore --verify-no-changes

      # The estate is deployed by azd, not CI (ADR 0004); CI checks that it builds and passes the Bicep linter. The CLI is the pinned one of the runner image
      # (infra/tool-versions.psd1, checked by the setup action), the one the dev container and the estate's architecture tests use, not `az bicep install`.
      - name: Build and lint the estate Bicep
        run: |
          bicep build infra/estate.bicep --stdout > /dev/null
          bicep lint infra/estate.bicep

      - name: Check for vulnerable packages
        run: |
          dotnet package list --project Norvia.slnx --vulnerable --include-transitive --format json > vulnerable-packages.json
          vulnerable=$(jq -r '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]
            | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"] | unique | .[]' vulnerable-packages.json)
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable packages found"
            echo "$vulnerable"
            exit 1
          fi

      # Every application's tests run in its leg of the integration job. A test project outside every leg would run nowhere, so a new application's tests
      # either join a leg (or tests/Integration) or fail here. It reads this file's matrix (the whole of GitHub's is ported, #1043).
      - name: Check that every test project is claimed by a leg
        run: |
          claimed=$(yq '.jobs.integration.strategy.matrix.include[].directory' .forgejo/workflows/ci.yml; echo Integration; echo Branding; echo Docs; echo ServiceDefaults)
          unclaimed=$(find tests -name '*.csproj' | cut -d/ -f2 | sort -u | grep -vxF "$claimed" || true)
          if [ -n "$unclaimed" ]; then
            echo "::error::Test projects under tests/ that no integration leg runs: $unclaimed"
            exit 1
          fi

      # The Integration functions have unit tests only, so they run here. Each project enforces the 80% line coverage threshold itself (Directory.Build.props).
      - name: Unit tests of the Integration functions and the shared Branding library, ServiceDefaults' faults and the docs generator
        run: |
          failed=0
          for project in $(find tests/Integration tests/Branding tests/Docs tests/ServiceDefaults -name '*.UnitTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      # Forgejo has no $GITHUB_STEP_SUMMARY page, so the Markdown summary goes to the log (and stays in TestResults/coverage with the artifact).
      - name: Coverage summary
        if: always()
        run: |
          if find tests/Integration tests/Branding tests/Docs tests/ServiceDefaults -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/Integration/**/coverage.cobertura.xml;tests/Branding/**/coverage.cobertura.xml;tests/Docs/**/coverage.cobertura.xml;tests/ServiceDefaults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md
          fi

      # v4 of the action needs GitHub's artifact service, which Forgejo does not have; v3 is the one Forgejo runs.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: build
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # The test matrix (#1042): one leg per application and kind of test, each in its own job container with its own Docker daemon (start-dockerd), so the
  # AppHosts of parallel legs cannot clash on container names or ports. The same steps as the `integration` job of .github/workflows/ci.yml, which stays
  # until the removal issue (#1030), so the two can be compared. Every leg of GitHub's matrix is here with the same application, directory and kinds, and
  # infra/compare-ci-matrices.ps1 (the `powershell` job) fails when the two matrices differ, so a leg added to one goes into the other in the same change.
  # The runner runs `capacity` jobs at once (.forgejo/runner/config.yaml) and the other legs queue; the timeout of a job counts from when it starts,
  # so `timeout-minutes` stays what one leg needs, not what the whole matrix takes.
  # Each leg reports its own status, forgejo/tests (<application>), so each can become required by itself; the `tests` job below rolls them up.
  integration:
    runs-on: norvia-ci
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: TMS
            directory: Tms
            kinds: UnitTests ArchitectureTests
          - application: TMS (Billing)
            directory: Tms
            kinds: IntegrationTests.Billing
          - application: TMS (Capacity)
            directory: Tms
            kinds: IntegrationTests.Capacity
          - application: TMS (Carrier bookings)
            directory: Tms
            kinds: IntegrationTests.CarrierBookings
          - application: TMS (Customer service agent)
            directory: Tms
            kinds: IntegrationTests.CustomerServiceAgent
          - application: TMS (Faults)
            directory: Tms
            kinds: IntegrationTests.Faults
          - application: TMS (Planning)
            directory: Tms
            kinds: IntegrationTests.Planning
          - application: TMS (Planner agent)
            directory: Tms
            kinds: IntegrationTests.PlannerAgent
          - application: TMS (Trips)
            directory: Tms
            kinds: IntegrationTests.Trips
          - application: TMS (Consignee tracking)
            directory: Tms
            kinds: IntegrationTests.ConsigneeTracking
          - application: TMS (Exceptions)
            directory: Tms
            kinds: IntegrationTests.Exceptions
          - application: TMS (Proofs of delivery)
            directory: Tms
            kinds: IntegrationTests.ProofsOfDelivery
          - application: TMS (Reset)
            directory: Tms
            kinds: IntegrationTests.Reset
          - application: TMS (Shipper tracking)
            directory: Tms
            kinds: IntegrationTests.ShipperTracking
          - application: TMS (Tracking events)
            directory: Tms
            kinds: IntegrationTests.TrackingEvents
          - application: TMS (Transport Orders)
            directory: Tms
            kinds: IntegrationTests.TransportOrders
          - application: TMS (API reference, seeds and AppHost model)
            directory: Tms
            kinds: IntegrationTests
          - application: TMS (UI, Customer service agent)
            directory: Tms
            kinds: UiTests.CustomerServiceAgent
          - application: TMS (UI, Planner agent)
            directory: Tms
            kinds: UiTests.PlannerAgent
          - application: TMS (UI, Planner agent, Plan the list)
            directory: Tms
            kinds: UiTests.PlannerAgentPlan
          - application: TMS (UI, Faults)
            directory: Tms
            kinds: UiTests.Faults
          - application: TMS (UI, Shipments)
            directory: Tms
            kinds: UiTests.Shipments
          - application: TMS (UI, Transport Orders)
            directory: Tms
            kinds: UiTests.TransportOrders
          - application: TMS (UI, other components)
            directory: Tms
            kinds: UiTests.Remaining
          - application: Partner portal
            directory: PartnerPortal
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Partner portal (Carrier and Shipper faults)
            directory: PartnerPortal
            kinds: IntegrationTests.Faults
          - application: Partner portal (Shipper tracking assistant)
            directory: PartnerPortal
            kinds: IntegrationTests.TrackingAssistant
          - application: Partner portal (UI, Intake agent)
            directory: PartnerPortal
            kinds: UiTests.IntakeAgent
          - application: Partner portal (UI, Shipper tracking assistant)
            directory: PartnerPortal
            kinds: UiTests.TrackingAssistant
          - application: ERP
            directory: Erp
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: ERP (Carrier invoice matching agent)
            directory: Erp
            kinds: IntegrationTests.FinanceAgent
          - application: ERP (UI, Carrier invoice matching agent)
            directory: Erp
            kinds: UiTests.FinanceAgent
          - application: Driver app
            directory: DriverApp
            kinds: UnitTests ArchitectureTests IntegrationTests
          - application: Simulator
            directory: Simulator
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Simulator (Invoicing)
            directory: Simulator
            kinds: IntegrationTests.Invoicing
          - application: Simulator (Personas)
            directory: Simulator
            kinds: IntegrationTests.Personas
          - application: Simulator (Reset)
            directory: Simulator
            kinds: IntegrationTests.Reset
          - application: Simulator (UI, Personas)
            directory: Simulator
            kinds: UiTests.Personas
          - application: Simulator (UI, Reset)
            directory: Simulator
            kinds: UiTests.Reset
          - application: Simulator (UI, Consignee tracking)
            directory: Simulator
            kinds: UiTests.ConsigneeTracking
          - application: Integration console
            directory: IntegrationConsole
            kinds: UnitTests ArchitectureTests IntegrationTests IntegrationTests.LocalTelemetry UiTests
          - application: Integration
            directory: Integration
            kinds: IntegrationTests
          - application: Integration (UI, master-data sync)
            directory: Integration
            kinds: UiTests
          - application: Estate health check
            directory: HealthCheck
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: tests (${{ matrix.application }})
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The AppHost runs SQL Server and the Service Bus emulator in Docker. The job container is privileged and has no host socket, so this starts the
      # daemon the leg alone uses (docs/operations/forgejo.md, "Runner for CI").
      - name: Start Docker
        run: start-dockerd

      - uses: ./.forgejo/actions/setup

      - name: Build
        run: |
          dotnet tool restore
          dotnet build Norvia.slnx --configuration "$CONFIGURATION"

      # Chromium's system libraries need root. The job runs as root, the job image's default user (the Dockerfile sets no USER), so `--with-deps`
      # works here as it does on GitHub's runner. Every UI test project uses the same Playwright version, so the leg's own project's script serves.
      - name: Install Playwright's Chromium
        if: contains(matrix.kinds, 'UiTests')
        run: pwsh "$(find tests/${{ matrix.directory }} -path "*/bin/$CONFIGURATION/net10.0/playwright.ps1" -print -quit)" install --with-deps chromium

      # UI tests keep a Playwright trace and video of every failed test. Each project enforces the 80% line coverage threshold itself (Directory.Build.props).
      - name: Unit, architecture, integration and UI tests
        env:
          NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/tms-api.log
          NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
          # DCP, which Aspire starts the resources with, writes its own log: for an AppHost that stalls as it starts.
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
          DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/TestResults/dcp
        run: |
          mkdir -p TestResults
          failed=0
          for kind in ${{ matrix.kinds }}; do
            for project in $(find tests/${{ matrix.directory }} -name "*.$kind.csproj" | sort); do
              dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
                --logger trx --results-directory TestResults || failed=1
            done
          done
          exit $failed

      # Forgejo has no $GITHUB_STEP_SUMMARY page, so the Markdown summary goes to the log (and stays in TestResults/coverage with the artifact).
      - name: Coverage summary
        if: always()
        run: |
          if find tests/${{ matrix.directory }} -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/${{ matrix.directory }}/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md
          fi

      # v3, as in the build job: v4 needs GitHub's artifact service.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results-${{ matrix.directory }}-${{ strategy.job-index }}
          path: TestResults/
          if-no-files-found: ignore

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: tests (${{ matrix.application }})
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # One name for branch protection to require instead of one per leg: forgejo/tests is green when every leg is. It runs when the legs are done, so it has
  # no `pending` of its own; until then the commit has no forgejo/tests, which a required-status rule reads as not yet passed.
  tests:
    needs: integration
    if: always()
    runs-on: norvia-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # `needs.integration.result` is success, failure, cancelled or skipped; any leg that failed fails it. report-status takes no `skipped`, so a
      # skipped matrix is reported as an error, not left to throw.
      - uses: ./.forgejo/actions/report-status
        with:
          job: tests
          state: ${{ needs.integration.result == 'skipped' && 'error' || needs.integration.result }}
          token: ${{ secrets.GH_STATUS_TOKEN }}
