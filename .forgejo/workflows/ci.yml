# The repo-level gates of CI (#1030): what is not one application's, so it runs on every push. Forgejo pull-mirrors GitHub and a sync triggers `push` (ADR 0055);
# each job reports to the GitHub commit as the status forgejo/<job>. The tests of each deployable are in a workflow of their own (#1079): tms.yml, erp.yml, ...,
# one per key of .forgejo/ci-scope.psd1. The `gate` job below is forgejo/ci, the one status for branch protection to require.
# Needs the Forgejo secret GH_STATUS_TOKEN (docs/operations/forgejo.md, "The GitHub status token"). Each later repo-level gate adds a job like `skeleton`.
name: ci
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NUGET_PACKAGES is not set here: the runner image sets it to a volume the runner mounts, so restored packages survive between runs (.forgejo/runner/config.yaml).
env:
  CONFIGURATION: Release

jobs:
  skeleton:
    runs-on: norvia-ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}
      - name: Trivial check
        run: git log -1 --format=%H
      # Last, whatever happened: success, failure, or cancelled (a newer push superseded this run).
      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # Scripts are PowerShell 7 (ADR 0048): every .ps1 parses, PSScriptAnalyzer reports no error and the Pester tests pass.
  powershell:
    runs-on: norvia-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The runner image has PowerShell and the modules (.forgejo/runner-image/Dockerfile), installed from infra/tool-versions.psd1. A stale image
      # fails here, with the version it has, and not as a confusing failure of the gate; rebuild it with runner-image.yml. The image's PATH is its own,
      # so nothing is written to $GITHUB_PATH.
      - name: Check the tool versions of the image
        shell: pwsh
        run: |
          $versions = Import-PowerShellDataFile ./infra/tool-versions.psd1
          $found = [ordered]@{ PowerShell = $PSVersionTable.PSVersion.ToString() }
          foreach ($name in 'PSScriptAnalyzer', 'Pester') {
              $module = Get-Module -ListAvailable $name | Sort-Object Version -Descending | Select-Object -First 1
              $found[$name] = $module ? $module.Version.ToString() : 'missing'
          }
          $found.Keys | ForEach-Object { Write-Host "$_ $($found[$_]) (pinned $($versions[$_]))" }
          $stale = $found.Keys | Where-Object { $found[$_] -ne $versions[$_] }
          if ($stale) { throw "The runner image is stale for $($stale -join ', '): rebuild it (docs/operations/forgejo.md, Runner for CI)." }

      - name: Parse, analyze and test the scripts
        shell: pwsh
        run: ./infra/test-scripts.ps1

      # Every process doc under docs/processes is in its catalogue's table and in docs/status.md.
      - name: Check that every process doc is catalogued
        shell: pwsh
        run: ./infra/check-process-docs.ps1

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The last job to finish decides forgejo/ci (gate action): no job waits for the others.
      - if: always()
        uses: ./.forgejo/actions/gate
        with:
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # Restore, a warnings-as-errors build, formatting, the estate's Bicep, vulnerable packages, and the unit tests of the shared libraries and the docs generator.
  build:
    runs-on: norvia-ci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: build
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      - uses: ./.forgejo/actions/setup

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Norvia.slnx

      # Warnings are errors (Directory.Build.props), so a clean build is also the "no warnings" gate.
      - name: Build
        run: dotnet build Norvia.slnx --no-restore --configuration "$CONFIGURATION"

      - name: Check formatting
        run: dotnet format Norvia.slnx --no-restore --verify-no-changes

      # The estate is deployed by azd, not CI (ADR 0004); CI checks that it builds and passes the Bicep linter. The CLI is the pinned one of the runner image
      # (infra/tool-versions.psd1, checked by the setup action), the one the dev container and the estate's architecture tests use, not `az bicep install`.
      - name: Build and lint the estate Bicep
        run: |
          bicep build infra/estate.bicep --stdout > /dev/null
          bicep lint infra/estate.bicep

      - name: Check for vulnerable packages
        run: |
          dotnet package list --project Norvia.slnx --vulnerable --include-transitive --format json > vulnerable-packages.json
          vulnerable=$(jq -r '[.projects[].frameworks[]? | (.topLevelPackages // [])[], (.transitivePackages // [])[]
            | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"] | unique | .[]' vulnerable-packages.json)
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable packages found"
            echo "$vulnerable"
            exit 1
          fi

      # Every application's tests run in a leg of its workflow (.forgejo/workflows/<application>.yml). A test project outside every workflow would run
      # nowhere, so a new application's tests either join a workflow (and .forgejo/ci-scope.psd1) or fail here. Branding, Docs and ServiceDefaults run below.
      - name: Check that every test project is claimed by a workflow
        run: |
          claimed=$(yq '.jobs.integration.steps[] | select(.uses == "./.forgejo/actions/test-leg") | .with.directory' .forgejo/workflows/*.yml; echo Branding; echo Docs; echo ServiceDefaults)
          unclaimed=$(find tests -name '*.csproj' | cut -d/ -f2 | sort -u | grep -vxF "$claimed" || true)
          if [ -n "$unclaimed" ]; then
            echo "::error::Test projects under tests/ that no application workflow runs: $unclaimed"
            exit 1
          fi

      # Each project enforces the 80% line coverage threshold itself (Directory.Build.props).
      - name: Unit tests of the shared Branding library, ServiceDefaults' faults and the docs generator
        run: |
          failed=0
          for project in $(find tests/Branding tests/Docs tests/ServiceDefaults -name '*.UnitTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
              --logger trx --results-directory TestResults || failed=1
          done
          exit $failed
      # Forgejo has no $GITHUB_STEP_SUMMARY page, so the Markdown summary goes to the log (and stays in TestResults/coverage with the artifact).
      - name: Coverage summary
        if: always()
        run: |
          if find tests/Branding tests/Docs tests/ServiceDefaults -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/Branding/**/coverage.cobertura.xml;tests/Docs/**/coverage.cobertura.xml;tests/ServiceDefaults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md
          fi

      # v4 of the action needs GitHub's artifact service, which Forgejo does not have; v3 is the one Forgejo runs.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: build
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The last job to finish decides forgejo/ci (gate action): no job waits for the others.
      - if: always()
        uses: ./.forgejo/actions/gate
        with:
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # forgejo/ci (#1079): the one status for branch protection to require. It starts pending here and is decided by the last job of the push to finish: this job,
  # build, powershell and the `result` job of every application workflow end with the gate action, which reads the statuses of the commit and reports success
  # when forgejo/powershell, forgejo/build and every forgejo/<application> passed, and failure at the first that did not. Every application workflow reports
  # forgejo/<application> on every push, a pass when the change does not affect it, so a path filter never leaves a status missing. Nothing waits, so no job
  # holds a runner slot that the others need. A new application needs no change here: the workflows are the keys of .forgejo/ci-scope.psd1.
  gate:
    runs-on: norvia-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: ci
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}      # If every other job is done already (this one queued behind them), nothing else will decide.
      - if: always()
        uses: ./.forgejo/actions/gate
        with:
          token: ${{ secrets.GH_STATUS_TOKEN }}
