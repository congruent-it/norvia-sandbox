# The gates of CI (#1030). Forgejo pull-mirrors GitHub and a sync triggers `push` (ADR 0055); each job reports to the GitHub commit as the status forgejo/<job>.
# Needs the Forgejo secret GH_STATUS_TOKEN (docs/operations/forgejo.md, "The GitHub status token"). Each later gate adds a job like `skeleton`.
name: ci
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton:
    runs-on: norvia-ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}
      - name: Trivial check
        run: git log -1 --format=%H
      # Last, whatever happened: success, failure, or cancelled (a newer push superseded this run).
      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: skeleton
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # Scripts are PowerShell 7 (ADR 0048): every .ps1 parses, PSScriptAnalyzer reports no error and the Pester tests pass. The same steps as the
  # `powershell` job of .github/workflows/ci.yml, which stays until the removal issue (#1030), so the two can be compared.
  powershell:
    runs-on: norvia-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The runner image has PowerShell and the modules (.forgejo/runner-image/Dockerfile), installed from infra/tool-versions.psd1. A stale image
      # fails here, with the version it has, and not as a confusing failure of the gate; rebuild it with runner-image.yml. The image's PATH is its own,
      # so nothing is written to $GITHUB_PATH.
      - name: Check the tool versions of the image
        shell: pwsh
        run: |
          $versions = Import-PowerShellDataFile ./infra/tool-versions.psd1
          $found = [ordered]@{
              PowerShell       = $PSVersionTable.PSVersion.ToString()
              PSScriptAnalyzer = (Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()
              Pester           = (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()
          }
          $stale = $found.Keys | Where-Object { $found[$_] -ne $versions[$_] }
          $found.Keys | ForEach-Object { Write-Host "$_ $($found[$_]) (pinned $($versions[$_]))" }
          if ($stale) { throw "The runner image is stale for $($stale -join ', '): rebuild it (docs/operations/forgejo.md, Runner for CI)." }

      - name: Parse, analyze and test the scripts
        shell: pwsh
        run: ./infra/test-scripts.ps1

      # Every process doc under docs/processes is in its catalogue's table and in docs/status.md.
      - name: Check that every process doc is catalogued
        shell: pwsh
        run: ./infra/check-process-docs.ps1

      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: powershell
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}
