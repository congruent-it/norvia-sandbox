# Builds the application images and pushes them to the Forgejo registry (#1044, #1045, #1046, #1047, ADR 0056). Each image is one `uses:` of build-image.yml.
# Runs on push to main (tagged with the short SHA and latest), on v* tags (the SHA and the version) and on a branch named image/* (the SHA only):
# every branch would fill the registry, and workflow_dispatch is not available on a mirror's push (infra/image-tags.ps1 holds the rule).
# Needs the Forgejo variable REGISTRY and the secrets REGISTRY_USER, REGISTRY_TOKEN and GH_STATUS_TOKEN (docs/operations/forgejo.md, "The registry").
name: images
on:
  push:
    branches: [main, 'image/**']
    tags: ['v*']

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tms-api:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Tms/Norvia.Tms.Api/Norvia.Tms.Api.csproj
      name: tms-api
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  erp-api:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Erp/Norvia.Erp.Api/Norvia.Erp.Api.csproj
      name: erp-api
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  driver-app-api:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/DriverApp/Norvia.DriverApp.Api/Norvia.DriverApp.Api.csproj
      name: driver-app-api
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  tms-migrations:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Tms/Norvia.Tms.Migrations/Norvia.Tms.Migrations.csproj
      name: tms-migrations
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  erp-migrations:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Erp/Norvia.Erp.Migrations/Norvia.Erp.Migrations.csproj
      name: erp-migrations
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  driver-app-migrations:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/DriverApp/Norvia.DriverApp.Migrations/Norvia.DriverApp.Migrations.csproj
      name: driver-app-migrations
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  partner-portal-migrations:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/PartnerPortal/Norvia.PartnerPortal.Migrations/Norvia.PartnerPortal.Migrations.csproj
      name: partner-portal-migrations
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  simulator-migrations:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Simulator/Norvia.Simulator.Migrations/Norvia.Simulator.Migrations.csproj
      name: simulator-migrations
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  tms-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Tms/Norvia.Tms.Web/Norvia.Tms.Web.csproj
      name: tms-web
      registry: ${{ vars.REGISTRY }}
      needs-node: true
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  erp-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Erp/Norvia.Erp.Web/Norvia.Erp.Web.csproj
      name: erp-web
      registry: ${{ vars.REGISTRY }}
      needs-node: true
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  driver-app-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/DriverApp/Norvia.DriverApp.Web/Norvia.DriverApp.Web.csproj
      name: driver-app-web
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  integration-console-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/IntegrationConsole/Norvia.IntegrationConsole.Web/Norvia.IntegrationConsole.Web.csproj
      name: integration-console-web
      registry: ${{ vars.REGISTRY }}
      needs-node: true
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  partner-portal-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/PartnerPortal/Norvia.PartnerPortal.Web/Norvia.PartnerPortal.Web.csproj
      name: partner-portal-web
      registry: ${{ vars.REGISTRY }}
      needs-node: true
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  simulator-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/Simulator/Norvia.Simulator.Web/Norvia.Simulator.Web.csproj
      name: simulator-web
      registry: ${{ vars.REGISTRY }}
      needs-node: true
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  health-check-web:
    uses: ./.forgejo/workflows/build-image.yml
    with:
      project: src/HealthCheck/Norvia.HealthCheck.Web/Norvia.HealthCheck.Web.csproj
      name: health-check-web
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  # The Logic App workers and the stand-ins the chart runs from workers.yaml, partner-api.yaml and agent-mcp.yaml (#1047): one matrix entry each, named as the chart names them.
  # Each entry restores from the runner's NuGet volume, so the packages are downloaded once. A worker that does not build fails its own entry only.
  integration:
    uses: ./.forgejo/workflows/build-image.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: billing-worker, project: src/Integration/Norvia.Integration.LocalBillingWorker/Norvia.Integration.LocalBillingWorker.csproj }
          - { name: booking-worker, project: src/Integration/Norvia.Integration.LocalBookingWorker/Norvia.Integration.LocalBookingWorker.csproj }
          - { name: carrier-cancellation-worker, project: src/Integration/Norvia.Integration.LocalCarrierCancellationWorker/Norvia.Integration.LocalCarrierCancellationWorker.csproj }
          - { name: carrier-cost-worker, project: src/Integration/Norvia.Integration.LocalCarrierCostWorker/Norvia.Integration.LocalCarrierCostWorker.csproj }
          - { name: carrier-invoice-outcome-worker, project: src/Integration/Norvia.Integration.LocalCarrierInvoiceOutcomeWorker/Norvia.Integration.LocalCarrierInvoiceOutcomeWorker.csproj }
          - { name: carrier-invoice-worker, project: src/Integration/Norvia.Integration.LocalCarrierInvoiceWorker/Norvia.Integration.LocalCarrierInvoiceWorker.csproj }
          - { name: consignee-notification-worker, project: src/Integration/Norvia.Integration.LocalConsigneeNotificationWorker/Norvia.Integration.LocalConsigneeNotificationWorker.csproj }
          - { name: driver-reports-worker, project: src/Integration/Norvia.Integration.LocalDriverReportsWorker/Norvia.Integration.LocalDriverReportsWorker.csproj }
          - { name: master-data-sync-worker, project: src/Integration/Norvia.Integration.LocalMasterDataSyncWorker/Norvia.Integration.LocalMasterDataSyncWorker.csproj }
          - { name: proof-of-delivery-worker, project: src/Integration/Norvia.Integration.LocalProofOfDeliveryWorker/Norvia.Integration.LocalProofOfDeliveryWorker.csproj }
          - { name: shipper-invoice-worker, project: src/Integration/Norvia.Integration.LocalShipperInvoiceWorker/Norvia.Integration.LocalShipperInvoiceWorker.csproj }
          - { name: shipper-notification-worker, project: src/Integration/Norvia.Integration.LocalShipperNotificationWorker/Norvia.Integration.LocalShipperNotificationWorker.csproj }
          - { name: tracking-worker, project: src/Integration/Norvia.Integration.LocalTrackingWorker/Norvia.Integration.LocalTrackingWorker.csproj }
          - { name: trip-dispatch-worker, project: src/Integration/Norvia.Integration.LocalTripDispatchWorker/Norvia.Integration.LocalTripDispatchWorker.csproj }
          - { name: partner-api, project: src/Integration/Norvia.Integration.LocalPartnerApi/Norvia.Integration.LocalPartnerApi.csproj }
          - { name: agent-mcp, project: src/Integration/Norvia.Integration.LocalAgentMcp/Norvia.Integration.LocalAgentMcp.csproj }
    with:
      project: ${{ matrix.project }}
      name: ${{ matrix.name }}
      registry: ${{ vars.REGISTRY }}
    secrets:
      GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
