# Simulator: the tests of one deployable (#1079). Part of the gates of CI (#1030): Forgejo pull-mirrors GitHub and a sync triggers `push` (ADR 0055).
# It always runs and reports forgejo/simulator, so the commit never lacks the status: the `scope` job asks .forgejo/ci-scope.psd1 whether the change affects
# this application, and a change that does not skips the legs and reports "Not affected" as a pass. forgejo/ci (ci.yml) waits for all of them.
# Needs the Forgejo secret GH_STATUS_TOKEN (docs/operations/forgejo.md, "The GitHub status token").
name: simulator
on:
  push:
    branches: ['**']

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

# NUGET_PACKAGES is not set here: the runner image sets it to a volume the runner mounts, so restored packages survive between runs (.forgejo/runner/config.yaml).
env:
  CONFIGURATION: Release

jobs:
  scope:
    runs-on: norvia-ci
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      # All history, for the merge-base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.forgejo/actions/scope
        with:
          application: simulator

  # One leg per kind of test of the application, each in its own job container with its own Docker daemon (start-dockerd), so the AppHosts of parallel legs
  # cannot clash on container names or ports. The runner runs `capacity` jobs at once (.forgejo/runner/config.yaml) and the other legs queue; the timeout
  # of a job counts from when it starts. Each leg reports its own status, forgejo/tests (<application>), so each can become required by itself.
  integration:
    needs: scope
    if: needs.scope.outputs.affected == 'true'
    runs-on: norvia-ci
    timeout-minutes: 30
    env:
      DIRECTORY: Simulator
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: Simulator
            kinds: UnitTests ArchitectureTests IntegrationTests UiTests
          - application: Simulator (Invoicing)
            kinds: IntegrationTests.Invoicing
          - application: Simulator (Personas)
            kinds: IntegrationTests.Personas
          - application: Simulator (Reset)
            kinds: IntegrationTests.Reset
          - application: Simulator (UI, Personas)
            kinds: UiTests.Personas
          - application: Simulator (UI, Reset)
            kinds: UiTests.Reset
          - application: Simulator (UI, Consignee tracking)
            kinds: UiTests.ConsigneeTracking
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: tests (${{ matrix.application }})
          state: pending
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The steps of one leg (#1042, #1079), the same in every application workflow. They are steps here, not a composite action, so Forgejo's run page
      # shows each one's log as it runs: a composite action is one row, with no log until it ends.
      # The AppHost runs SQL Server and the Service Bus emulator in Docker. The job container is privileged and has no host socket, so this starts the
      # daemon the leg alone uses (docs/operations/forgejo.md, "Runner for CI").
      - name: Start Docker
        run: start-dockerd

      - uses: ./.forgejo/actions/setup

      # The AppHost starts SQL Server, the storage emulator and two Service Bus emulators, and its startup is cut off after 10 minutes. Pulled here, a slow or
      # blocked pull shows in this step's log with its time and no longer counts against the fixtures. The tags are the ones Aspire.Hosting uses (the
      # diagnostics below list what the daemon holds); a stale tag only makes this step pull an image nobody uses. A failed pull does not fail the leg.
      - name: Pull the AppHost's images
        if: contains(matrix.kinds, 'IntegrationTests') || contains(matrix.kinds, 'UiTests')
        run: |
          for image in mcr.microsoft.com/mssql/server:2022-latest mcr.microsoft.com/azure-storage/azurite:3.37.0 mcr.microsoft.com/azure-messaging/servicebus-emulator:latest; do
            echo "== $image"
            start=$(date +%s)
            docker pull "$image" || echo "::warning::pulling $image failed"
            echo "$(( $(date +%s) - start )) s"
          done

      # Where do a container's published ports end up? The first runs of the AppHost legs started SQL Server but it never became reachable, and the daemon
      # was the runner pod's own, not one of the job's. This starts a cached container with a published port and calls it on the hosts a job could reach it
      # by. A status code means reachable; "unreachable" means not. It never fails the leg.
      - name: Probe Docker networking
        if: contains(matrix.kinds, 'IntegrationTests') || contains(matrix.kinds, 'UiTests')
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          docker info --format 'daemon {{.Name}}, root {{.DockerRootDir}}, {{.Driver}}' || true
          gw_hex=$(awk '$2=="00000000" {print $3; exit}' /proc/net/route)
          gateway=""
          if [ -n "$gw_hex" ]; then gateway=$(printf '%d.%d.%d.%d' "0x${gw_hex:6:2}" "0x${gw_hex:4:2}" "0x${gw_hex:2:2}" "0x${gw_hex:0:2}"); fi
          daemon_host="${DOCKER_HOST#tcp://}"; daemon_host="${daemon_host%%:*}"
          echo "container address: $(hostname -i 2>/dev/null || true), default gateway: ${gateway:-none}, daemon host: ${daemon_host:-none}"
          docker run -d --rm --name probe -p 10555:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 azurite-blob --blobHost 0.0.0.0 || echo "::warning::the probe container did not start"
          sleep 5
          for host in localhost "$gateway" "$daemon_host"; do
            [ -n "$host" ] || continue
            printf '%s:10555 -> ' "$host"
            curl -sS -m 5 -o /dev/null -w '%{http_code}\n' "http://$host:10555/" 2>&1 || echo "unreachable"
          done
          docker rm -f probe >/dev/null 2>&1 || true
      # Builds the leg's own test projects, and so what they reference (the AppHost's applications among them), not the whole solution: a leg does not need the
      # test projects of the other applications (the Driver app's leg: 66 projects, not 199). The `build` job of ci.yml builds Norvia.slnx once, warnings as errors.
      - name: Build
        env:
          KINDS: ${{ matrix.kinds }}
        run: |
          dotnet tool restore
          for kind in $KINDS; do
            for project in $(find tests/$DIRECTORY -name "*.$kind.csproj" | sort); do
              dotnet build "$project" --configuration "$CONFIGURATION"
            done
          done

      # Chromium's system libraries need root. The job runs as root, the job image's default user (the Dockerfile sets no USER), so `--with-deps`
      # works here as it does on GitHub's runner. Every UI test project uses the same Playwright version, so the leg's own project's script serves.
      - name: Install Playwright's Chromium
        if: contains(matrix.kinds, 'UiTests')
        run: pwsh "$(find tests/$DIRECTORY -path "*/bin/$CONFIGURATION/net10.0/playwright.ps1" -print -quit)" install --with-deps chromium

      # UI tests keep a Playwright trace and video of every failed test. Each project enforces the 80% line coverage threshold itself (Directory.Build.props).
      - name: Unit, architecture, integration and UI tests
        env:
          KINDS: ${{ matrix.kinds }}
          NORVIA_TEST_LOG_FILE: ${{ github.workspace }}/TestResults/${{ env.DIRECTORY }}.log
          NORVIA_UI_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults
          # DCP, which Aspire starts the resources with, writes its own log: for an AppHost that stalls as it starts.
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
          DCP_DIAGNOSTICS_LOG_FOLDER: ${{ github.workspace }}/TestResults/dcp
        run: |
          mkdir -p TestResults
          failed=0
          for kind in $KINDS; do
            for project in $(find tests/$DIRECTORY -name "*.$kind.csproj" | sort); do
              dotnet test "$project" --no-build --configuration "$CONFIGURATION" \
                --logger trx --results-directory TestResults || failed=1
            done
          done
          exit $failed

      # When the AppHost does not start (Aspire's startup timeout), these say whether the daemon pulled its images and which container is stuck.
      - name: Docker diagnostics
        if: failure()
        run: |
          docker info || true
          docker images || true
          docker ps -a || true
          # What the daemon did in the last 30 minutes (pulls, creates, dies), since the AppHost has removed its containers by now.
          timeout 60 docker events --since 30m --until 0s 2>&1 | tail -n 200 || true
          for log in TestResults/dcp/*; do [ -f "$log" ] && { echo "== $log"; tail -n 50 "$log"; }; done || true
      # Forgejo has no $GITHUB_STEP_SUMMARY page, so the Markdown summary goes to the log (and stays in TestResults/coverage with the artifact).
      - name: Coverage summary
        if: always()
        run: |
          if find tests/$DIRECTORY -name coverage.cobertura.xml | grep -q .; then
            dotnet reportgenerator -reports:"tests/$DIRECTORY/**/coverage.cobertura.xml" -targetdir:TestResults/coverage \
              -reporttypes:"MarkdownSummaryGithub;Cobertura"
            cat TestResults/coverage/SummaryGithub.md
          fi

      # v3: v4 needs GitHub's artifact service, which Forgejo does not have.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ github.workflow }}-${{ matrix.kinds }}
          path: TestResults/
          if-no-files-found: ignore
      - if: always()
        uses: ./.forgejo/actions/report-status
        with:
          job: tests (${{ matrix.application }})
          state: ${{ job.status }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

  # forgejo/simulator: green when every leg is, or when the change does not affect the application. It runs when the legs are done, so it has no `pending` of its
  # own; until then forgejo/ci waits for it. A failed scope job is an error, not a pass.
  result:
    needs: [scope, integration]
    if: always()
    runs-on: norvia-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/report-status
        with:
          job: simulator
          state: ${{ needs.scope.result != 'success' && 'error' || (needs.integration.result == 'skipped' && 'success' || needs.integration.result) }}
          description: ${{ needs.scope.result != 'success' && 'The scope job did not pass' || (needs.integration.result == 'skipped' && 'Not affected by this change' || '') }}
          token: ${{ secrets.GH_STATUS_TOKEN }}

      # The last job to finish decides forgejo/ci (gate action): no job waits for the others.
      - if: always()
        uses: ./.forgejo/actions/gate
        with:
          token: ${{ secrets.GH_STATUS_TOKEN }}
