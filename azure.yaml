# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# `azd up` deploys the estate Bicep in infra/ first, then the apps from the Aspire AppHost (ADR 0004).
name: norvia-sandbox
services:
  app:
    language: dotnet
    project: ./src/Norvia.AppHost/Norvia.AppHost.csproj
    host: containerapp
hooks:
  # The estate goes first. azd asks for the AppHost's parameters, the estate's outputs, before it runs preprovision,
  # so `azd up` deploys the estate in preup; `azd provision` on its own does it in preprovision.
  preup:
    shell: sh
    run: ./infra/provision-estate.sh
    interactive: true
  preprovision:
    shell: sh
    run: ./infra/provision-estate.sh
    interactive: true
  # Then the databases' migrations, the Logic Apps, which need the address of the TMS just deployed, and the
  # demo UIs', the Integration console's, the Simulator's and the ERP's sign-in, which need theirs.
  # SKIP_POSTDEPLOY=true skips all of it, for a deployment of one app that changes none of that:
  #   SKIP_POSTDEPLOY=true azd deploy health-check-web
  postdeploy:
    shell: sh
    run: >-
      if [ "${SKIP_POSTDEPLOY:-}" = true ]; then echo "SKIP_POSTDEPLOY is true: the migrations, the Logic Apps, the sign-in callbacks and the Agents are not deployed."; exit 0; fi;
      ./infra/migrate.sh tms-migrations "the TMS database" &&
      ./infra/migrate.sh partner-portal-migrations "the Partner portal's database" &&
      ./infra/migrate.sh driver-app-migrations "the Driver app's database" &&
      ./infra/migrate.sh simulator-migrations "the Simulator's database" &&
      ./infra/migrate.sh erp-migrations "the ERP's database" &&
      ./infra/deploy-intake-logic-app.sh &&
      ./infra/deploy-booking-logic-app.sh &&
      ./infra/deploy-shipper-notification-logic-app.sh &&
      ./infra/deploy-carrier-cancellation-logic-app.sh &&
      ./infra/deploy-trip-dispatch-logic-app.sh &&
      ./infra/deploy-driver-reports-logic-app.sh &&
      ./infra/deploy-conversation-sweeper-logic-app.sh &&
      ./infra/deploy-billing-logic-app.sh &&
      ./infra/deploy-carrier-cost-logic-app.sh &&
      ./infra/deploy-shipper-invoice-logic-app.sh &&
      ./infra/deploy-answer-logic-app.sh &&
      ./infra/deploy-carrier-invoice-logic-app.sh &&
      ./infra/deploy-carrier-invoice-outcome-logic-app.sh &&
      ./infra/deploy-tracking-logic-app.sh &&
      ./infra/deploy-proof-of-delivery-logic-app.sh &&
      ./infra/register-sign-in-callbacks.sh &&
      ./infra/deploy-agents.sh
